    <style type="text/tailwindcss">
      body {
        overscroll-behavior: none;
      }
      .range-thumb-purple::-webkit-slider-thumb {
        -webkit-appearance: none; appearance: none;
        width: 16px; height: 16px;
        background: #a855f7; /* purple-500 */
        cursor: pointer; border-radius: 9999px;
      }
      .range-thumb-purple::-moz-range-thumb {
        width: 16px; height: 16px;
        background: #a855f7;
        cursor: pointer; border-radius: 9999px;
      }
      .gradient-bg {
        background: linear-gradient(-45deg, #1a1b26, #2c213d, #1a1b26, #3c2a54);
        background-size: 400% 400%;
        animation: gradient 15s ease infinite;
      }
      @keyframes gradient {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      @keyframes fade-in-right {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }
      .animate-fade-in-right { animation: fade-in-right 0.3s ease-out forwards; }

      /* Slideshow animations */
      .slideshow-container { overflow: hidden; position: relative; }
      .slideshow-img { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; opacity: 0; transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out; }
      .slideshow-img.active { opacity: 1; z-index: 10; transform: scale(1); }
      .slideshow-img.previous { opacity: 1; z-index: 9; }
      
      /* --- Standard Transitions --- */
      .transition-fade .slideshow-img.previous { opacity: 0; }
      .transition-slide .slideshow-img.active { animation: slide-in 0.7s forwards; }
      .transition-slide .slideshow-img.previous { animation: slide-out 0.7s forwards; }
      @keyframes slide-in { from { transform: translateX(100%); } to { transform: translateX(0); } }
      @keyframes slide-out { from { transform: translateX(0); } to { transform: translateX(-100%); } }
      .transition-wipe .slideshow-img.active::before { content: ''; position: absolute; inset: 0; background: inherit; animation: wipe-in 1s forwards; }
      @keyframes wipe-in { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      .transition-glitch .slideshow-img.active { animation: glitch-anim 0.5s forwards; }
       @keyframes glitch-anim {
        0% { transform: translate(0); opacity: 1; } 20% { transform: translate(-3px, 3px); } 40% { transform: translate(-3px, -3px); }
        60% { transform: translate(3px, 3px); } 80% { transform: translate(3px, -3px); } 100% { transform: translate(0); }
      }

      /* --- New Futuristic Transitions --- */
      .slideshow-img.active { transition-property: opacity, transform, clip-path; }
      .slideshow-img.previous { transition-property: opacity, transform, clip-path; }

      /* Zoom Blur */
      .transition-zoom-blur .slideshow-img.active { animation: zoom-blur-in 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards; }
      .transition-zoom-blur .slideshow-img.previous { animation: zoom-blur-out 0.8s cubic-bezier(0.5, 0, 0.75, 0) forwards; }
      @keyframes zoom-blur-in { from { transform: scale(1.5); filter: blur(10px); opacity: 0; } to { transform: scale(1); filter: blur(0); opacity: 1; } }
      @keyframes zoom-blur-out { from { transform: scale(1); filter: blur(0); opacity: 1; } to { transform: scale(0.5); filter: blur(10px); opacity: 0; } }

      /* Glitch Warp */
      .transition-glitch-warp .slideshow-img.previous { animation: glitch-warp-out 0.6s forwards; }
      .transition-glitch-warp .slideshow-img.active { animation: glitch-warp-in 0.6s forwards; }
      @keyframes glitch-warp-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes glitch-warp-out {
          0% { clip-path: inset(0 0 0 0); transform: translateX(0); }
          20% { clip-path: inset(20% 0 50% 0); transform: translateX(-10px); }
          40% { clip-path: inset(50% 0 10% 0); transform: translateX(10px); }
          60% { clip-path: inset(10% 0 80% 0); transform: translateX(-5px); }
          80% { clip-path: inset(80% 0 5% 0); transform: translateX(5px); }
          100% { clip-path: inset(50% 0 50% 0); transform: translateX(0); opacity: 0; }
      }

      /* Vertical Shutter */
      .transition-shutter-v .slideshow-img.active { clip-path: inset(100% 0 0 0); animation: shutter-v-in 1s ease-in-out forwards; }
      .transition-shutter-v .slideshow-img.previous { animation: shutter-v-out 1s ease-in-out forwards; }
      @keyframes shutter-v-in { to { clip-path: inset(0 0 0 0); } }
      @keyframes shutter-v-out { to { clip-path: inset(0 0 100% 0); } }

      /* Circle Wipe */
      .transition-circle-wipe .slideshow-img.active { clip-path: circle(0% at 50% 50%); animation: circle-wipe-in 1s ease-in-out forwards; }
      @keyframes circle-wipe-in { to { clip-path: circle(75% at 50% 50%); } }
      
      /* Diagonal Wipe */
      .transition-diag-wipe .slideshow-img.active { clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); animation: diag-wipe-in 1s ease-in-out forwards; }
      @keyframes diag-wipe-in { to { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); } }

      /* Box In */
      .transition-box-in .slideshow-img.active { clip-path: inset(50% 50% 50% 50%); animation: box-in 1s ease-out forwards; }
      @keyframes box-in { to { clip-path: inset(0 0 0 0); } }

      /* RGB Split */
      .transition-rgb-split .slideshow-img.previous { animation: rgb-split-out 0.6s forwards; }
      .transition-rgb-split .slideshow-img.previous::before, .transition-rgb-split .slideshow-img.previous::after { content: ''; position: absolute; inset: 0; background: inherit; mix-blend-mode: lighten; }
      .transition-rgb-split .slideshow-img.previous::before { animation: rgb-split-anim 0.6s forwards; filter: hue-rotate(120deg); }
      .transition-rgb-split .slideshow-img.previous::after { animation: rgb-split-anim 0.6s forwards; filter: hue-rotate(240deg); animation-direction: reverse; }
      @keyframes rgb-split-anim { from { transform: translate(0, 0); } to { transform: translate(10px, -5px); } }
      @keyframes rgb-split-out { from { opacity: 1; } to { opacity: 0; } }

      /* Scanline Wipe */
      .transition-scan-wipe .slideshow-img.active::before { content: ''; position: absolute; inset: 0; background: inherit; -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 5%, transparent 10%); mask-image: linear-gradient(to bottom, transparent 0%, black 5%, transparent 10%); -webkit-mask-size: 100% 2000%; mask-size: 100% 2000%; animation: scan-wipe-in 1.2s linear forwards; }
      @keyframes scan-wipe-in { from { -webkit-mask-position: 0 100%; mask-position: 0 100%; } to { -webkit-mask-position: 0 0; mask-position: 0 0; } }


      /* Timeline clip triangular handles */
      .timeline-clip-handle {
          position: absolute;
          top: 50%;
          transform: translateY(-50%);
          width: 0;
          height: 0;
          border-style: solid;
          cursor: ew-resize;
          z-index: 20;
          opacity: 0.6;
      }
      .group:hover .timeline-clip-handle { opacity: 1; }
      .timeline-clip-handle-left {
          left: -1px;
          border-width: 24px 12px 24px 0;
          border-color: transparent #a855f7 transparent transparent;
      }
      .timeline-clip-handle-right {
          right: -1px;
          border-width: 24px 0 24px 12px;
          border-color: transparent transparent transparent #a855f7;
      }
      /* Safe Zone for 9:16 editor */
      .safe-zone-overlay {
        position: absolute;
        inset: 0;
        border: 2px dashed rgba(255, 255, 255, 0.4);
        box-shadow: 0 0 0 9999px rgba(0,0,0,0.5);
        pointer-events: none;
        /* Common safe margins for social media UIs */
        margin-top: 8%; margin-bottom: 15%; margin-left: 5%; margin-right: 5%;
      }
    </style>
