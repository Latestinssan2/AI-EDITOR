<!DOCTYPE html>
<html lang="en" class="theme-genesis">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1b26" />
    <title>Gemini Genesis Editor V8</title>
    <link rel="manifest" href="/manifest.json" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text-primary);
      }
      :root, .theme-dark {
        --color-bg: #111111;
        --color-bg-secondary: #1e1e1e;
        --color-bg-tertiary: #2a2a2a;
        --color-border: #3a3a3a;
        --color-text-primary: #f0f0f0;
        --color-text-secondary: #a0a0a0;
        --color-primary-hue: 270; /* default to genesis purple */
        --color-primary: hsl(var(--color-primary-hue), 80%, 60%);
        --color-primary-hover: hsl(var(--color-primary-hue), 80%, 70%);
        --color-primary-focus: hsl(var(--color-primary-hue), 80%, 50%);
        --color-success: #22c55e;
        --color-error: #ef4444;
        --color-info: #3b82f6;
      }
      .theme-light {
        --color-bg: #f9fafb;
        --color-bg-secondary: #ffffff;
        --color-bg-tertiary: #f3f4f6;
        --color-border: #e5e7eb;
        --color-text-primary: #111827;
        --color-text-secondary: #6b7280;
      }
      .theme-genesis { --color-primary-hue: 270; }
      .theme-aurora { --color-primary-hue: 145; }
      .theme-capcut { --color-primary-hue: 210; }

      .gradient-bg {
        background: black;
        position: relative;
        overflow: hidden;
      }
      .gradient-bg::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background-image:
            radial-gradient(circle at 10% 20%, hsla(270, 80%, 60%, 0.4) 0%, transparent 40%),
            radial-gradient(circle at 80% 10%, hsla(330, 80%, 60%, 0.3) 0%, transparent 40%),
            radial-gradient(circle at 50% 80%, hsla(210, 80%, 60%, 0.4) 0%, transparent 40%);
        background-size: 250% 250%;
        animation: glow-move 40s linear infinite;
        filter: blur(80px);
        z-index: 1;
      }
      
      @keyframes glow-move {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }

      /* Slideshow Transitions */
      .slideshow-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 1s ease-in-out;
      }
      .slideshow-img.active {
        opacity: 1;
        z-index: 1;
      }
      .slideshow-img.previous {
        z-index: 0;
      }

      /* Fade */
      .transition-fade .slideshow-img.active { animation: fadeIn 1s forwards; }
      .transition-fade .slideshow-img.previous { animation: fadeOut 1s forwards; }

      /* Slide */
      .transition-slide .slideshow-img.active { animation: slideInFromRight 1s forwards; }
      .transition-slide .slideshow-img.previous { animation: slideOutToLeft 1s forwards; }
      
      /* Zoom In */
      .transition-zoom-in .slideshow-img.active { animation: zoomIn 1s forwards; }
      .transition-zoom-in .slideshow-img.previous { animation: fadeOut 1s forwards; }
      
      /* Zoom Out */
      .transition-zoom-out .slideshow-img.active { animation: zoomOut 1s forwards; }
      .transition-zoom-out .slideshow-img.previous { animation: fadeOut 1s forwards; }

      /* Ken Burns */
      .transition-ken-burns .slideshow-img.active { animation: fadeIn 1s forwards, kenBurns 5s forwards; }
      .transition-ken-burns .slideshow-img.previous { animation: fadeOut 1s forwards; }

      /* Wipe */
      .transition-wipe .slideshow-img.active { animation: wipeIn 1s forwards; }
      .transition-wipe .slideshow-img.previous { opacity: 1; animation: fadeOut 1.1s forwards; }

      /* Glitch */
      .transition-glitch .slideshow-img.active { animation: fadeIn 0.1s forwards, glitchAnim 0.8s forwards steps(2, end); }
      .transition-glitch .slideshow-img.previous { animation: fadeOut 1s forwards; }


      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
      @keyframes slideInFromRight { from { transform: translateX(100%); opacity: 1; } to { transform: translateX(0); opacity: 1; } }
      @keyframes slideOutToLeft { from { transform: translateX(0); opacity: 1; } to { transform: translateX(-100%); opacity: 1; } }
      @keyframes zoomIn { from { transform: scale(1.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes zoomOut { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      @keyframes kenBurns {
        0% { transform: scale(1) translate(0, 0); }
        50% { transform: scale(1.2) translate(-2%, 2%); }
        100% { transform: scale(1) translate(0, 0); }
      }
      @keyframes wipeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      
      @keyframes glitchAnim {
        0% { transform: translate(0); opacity: 1; }
        25% { transform: translate(5px, -5px); }
        50% { transform: translate(-5px, 5px); }
        75% { transform: translate(5px, 5px); }
        100% { transform: translate(0); }
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.25.0",
    "uuid": "https://aistudiocdn.com/uuid@^13.0.0",
    "react-dnd": "https://aistudiocdn.com/react-dnd@^16.0.1",
    "react-dnd-html5-backend": "https://aistudiocdn.com/react-dnd-html5-backend@^16.0.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(error => {
              console.log('ServiceWorker registration failed: ', error);
            });
        });
      }
    </script>
  </body>
</html>
